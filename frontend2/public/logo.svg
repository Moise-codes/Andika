<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- Clean blue gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3367D6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Clean rounded square background -->
  <rect x="12" y="12" width="96" height="96" rx="20" ry="20" 
        fill="url(#blueGradient)" filter="url(#shadow)"/>
  
  <!-- LoneZen monogram - modern LZ -->
  <g transform="translate(60, 62)">
    <!-- L shape -->
    <path d="M-20 -16 L-20 16 L-6 16 L-6 12 L-16 12 L-16 -16 Z" 
          fill="#FFFFFF" stroke="none"/>
    
    <!-- Z shape -->
    <path d="M-2 -16 L20 -16 L20 -12 L4 -12 L4 12 L20 12 L20 16 L-4 16 L-4 -12 L-2 -12 Z" 
          fill="#FFFFFF" stroke="none"/>
  </g>
  
  <!-- Subtle zen dot -->
  <circle cx="60" cy="88" r="3" fill="#FFFFFF" opacity="0.8"/>
</svg>