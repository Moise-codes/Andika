# ANDIKA uses ONE database: a managed Supabase Postgres project (which also
# provides Auth). There is intentionally no local Postgres container here — set
# DATABASE_URL / DIRECT_URL to your Supabase project in backend/.env.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: andika-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: andika-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
