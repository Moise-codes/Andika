<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#2D5A27"/>
  
  <!-- Inner circle -->
  <circle cx="200" cy="200" r="160" fill="#4A7C42" opacity="0.3"/>
  
  <!-- Keyboard base -->
  <rect x="60" y="140" width="280" height="160" rx="16" fill="#F5F5F0"/>
  
  <!-- Keyboard rows -->
  <rect x="80" y="160" width="240" height="24" rx="8" fill="#4A7C42"/>
  <rect x="80" y="192" width="240" height="24" rx="8" fill="#4A7C42"/>
  <rect x="80" y="224" width="240" height="24" rx="8" fill="#4A7C42"/>
  <rect x="80" y="256" width="240" height="24" rx="8" fill="#4A7C42"/>
  
  <!-- Typing cursor/caret -->
  <rect x="260" y="156" width="8" height="32" fill="#2D5A27">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Speed lines -->
  <path d="M40 100 L80 120" stroke="#F5F5F0" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 80 L100 110" stroke="#F5F5F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 60 L120 100" stroke="#F5F5F0" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 40 L140 90" stroke="#F5F5F0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- ANDIKA text -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5F5F0" text-anchor="middle">ANDIKA</text>
</svg>
