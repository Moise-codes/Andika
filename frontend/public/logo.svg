<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern professional logo - stylized A with typing elements -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7C42"/>
      <stop offset="100%" style="stop-color:#2D5A27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#415239" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle with subtle gradient -->
  <circle cx="60" cy="60" r="52" fill="url(#logoGradient)" filter="url(#shadow)" opacity="0.1"/>

  <!-- Main letter A - modern geometric design -->
  <path d="M60 25 L30 90 H38 L45 72 H75 L82 90 H90 L60 25Z" fill="url(#logoGradient)" filter="url(#shadow)"/>

  <!-- Inner triangle (negative space) -->
  <path d="M60 40 L48 68 H72 L60 40Z" fill="#FAF8F5"/>

  <!-- Typing cursor accent -->
  <rect x="58" y="50" width="4" height="12" rx="1" fill="#4A7C42" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Speed lines suggesting typing motion -->
  <path d="M25 30 L35 35" stroke="#415239" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M28 22 L40 30" stroke="#415239" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
</svg>
